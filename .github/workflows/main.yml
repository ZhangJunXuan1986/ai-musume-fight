name: Deploy to GitHub Pages (pygbag)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize layout (tolerate flat upload)
        run: |
          python - <<'PY'
          import os, shutil, sys
          if not os.path.exists("game/main.py"):
              os.makedirs("game/assets", exist_ok=True)
              os.makedirs("tools", exist_ok=True)
              for src, dst in [
                  ("main.py", "game/main.py"),
                  ("font.ttf", "game/assets/font.ttf"),
                  ("favicon.png", "game/favicon.png"),
                  ("patch_index.py", "tools/patch_index.py"),
                  ("make_font.py", "tools/make_font.py"),
              ]:
                  if os.path.exists(src) and not os.path.exists(dst):
                      shutil.copy2(src, dst)
          if not os.path.exists("game/main.py"):
              sys.exit("ERROR: 仓库里找不到 main.py，无法构建。")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: python -m pip install --upgrade pip pygbag pygame-ce

      - name: Build WASM (build only, no server)
        run: python -m pygbag --build --width 1280 --height 720 game

      # v7：撤销 v3~v6 对 canvas 的一切 CSS 干预。
      # 键盘不走坐标换算所以一直能用；鼠标/触摸走 clientX -> 画布坐标，
      # 改 canvas 的 style.width / transform / margin 会污染这套换算。
      # 这里只改 viewport meta（浏览器级缩放，手机能看全），
      # 【绝不】改 canvas 尺寸、绝不删它的 style、绝不加 canvas{...} 规则。
      - name: Minimal page patch (leave canvas untouched)
        run: |
          python - <<'PY'
          import io, os, re, sys
          p = "game/build/web/index.html"
          if not os.path.exists(p):
              sys.exit("ERROR: 找不到 " + p)
          src = io.open(p, encoding="utf-8", errors="replace").read()

          # 1) 清掉历次注入过的所有补丁块，避免叠层
          for pat in [
              r'<style id="AIMF_WEB_PATCH_V[0-9]+">.*?</style>\s*',
              r'<style id="aimf-fit-css-v[0-9]+">.*?</style>\s*',
              r'<div id="aimf-rotate[^"]*">.*?</div>\s*',
              r'<script id="aimf-fit-js-v[0-9]+">.*?</script>\s*',
              r'<script id="aimf-vp-js">.*?</script>\s*',
              r'<script>\s*\(function\(\)\{\s*var lastW=0,lastH=0,tries=0;.*?</script>\s*',
              r'<script>\s*\(function\(\)\{\s*var tries=0;.*?</script>\s*',
              r'<style>\s*#aimf-tip\{.*?</style>\s*',
              r'<div id="aimf-tip">.*?</div>\s*',
          ]:
              src = re.sub(pat, '', src, flags=re.S)

          # 2) 只替换 viewport：布局视口 = 1280，浏览器整体缩放页面。
          #    canvas 元素本身保持 pygbag 原样，clientX 与画布坐标同处 1280 系。
          src, n = re.subn(r'<meta\s+name=["\']viewport["\'][^>]*>',
              '<meta name="viewport" content="width=1280, user-scalable=no, viewport-fit=cover">',
              src, count=1, flags=re.I)
          if n == 0:
              src = re.sub(r'(<head[^>]*>)',
                  r'\1\n<meta name="viewport" content="width=1280, user-scalable=no, viewport-fit=cover">',
                  src, count=1, flags=re.I)

          # 3) 竖屏提示：小胶囊、pointer-events:none，不覆盖 canvas、不吃点击
          tip = """<style>
          #aimf-tip{display:none;position:fixed;left:50%;top:8px;transform:translateX(-50%);
            z-index:9;pointer-events:none;background:rgba(11,13,28,.85);color:#ffd060;
            padding:8px 18px;border-radius:22px;font:600 14px/1.4 system-ui,sans-serif;}
          @media (orientation:portrait){#aimf-tip{display:block}}
          </style>
          <div id="aimf-tip">请把手机横过来玩</div>
          """
          src = src.replace('</body>', tip + '</body>', 1) if '</body>' in src else src + tip
          io.open(p,'w',encoding='utf-8').write(src)
          print("[aimusume-fit] v7: canvas untouched, viewport-only scaling")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
